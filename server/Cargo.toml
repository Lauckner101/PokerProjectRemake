[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
itertools = "0.10"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.20"
tungstenite = "0.20"
futures-util = "0.3"
warp = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }